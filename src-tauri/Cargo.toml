[package]
name = "worktreeview"
version = "0.5.1"
description = "Code review UI for Git worktrees"
license = "Apache-2.0"
authors = ["Peter Etelej"]
edition = "2021"
# Two binaries share the crate since the server tier; without this the
# bare `cargo run` behind `tauri dev` refuses to pick between them.
default-run = "worktreeview"

[features]
# default-on so cargo still builds the server bin; the Tauri CLI only sees
# explicitly passed features, so it keeps the bin out of desktop bundles
server-bin = []
default = ["server-bin"]

[[bin]]
name = "worktreeview"
path = "src/main.rs"

[[bin]]
name = "worktreeview-server"
path = "src/bin/worktreeview-server.rs"
required-features = ["server-bin"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "worktreeview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
getrandom = "0.3"
httparse = "1"
log = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-log = "2.9.1"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "net"] }
