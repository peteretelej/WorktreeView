[package]
name = "worktreeview"
version = "0.0.3"
description = "Code review UI for Git worktrees"
license = "Apache-2.0"
authors = ["Peter Etelej"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "worktreeview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
tokio = { version = "1", features = ["process", "io-util", "time", "macros"] }
