name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-24.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
          set-safe-directory: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set app version from tag
        timeout-minutes: 2
        run: |
          version="${GITHUB_REF_NAME#v}"
          VERSION="$version" node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(v)) {
              console.error("tag " + process.env.GITHUB_REF_NAME + " is not a valid vX.Y.Z version");
              process.exit(1);
            }
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = v;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            lock.version = v;
            lock.packages[""].version = v;
            fs.writeFileSync("package-lock.json", JSON.stringify(lock, null, 2) + "\n");
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            conf.version = v;
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2) + "\n");
            const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            if (!/^version = "/m.test(cargo)) throw new Error("no package version line in Cargo.toml");
            fs.writeFileSync("src-tauri/Cargo.toml", cargo.replace(/^version = "[^"]*"/m, "version = \"" + v + "\""));
          '

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        timeout-minutes: 5
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        # The timeout also covers the post-build cache save, which is the
        # slow half on Windows' multi-gigabyte target directory.
        timeout-minutes: 15
        with:
          workspaces: src-tauri
          key: ${{ matrix.args }}

      - name: Install Linux packages
        if: matrix.platform == 'ubuntu-24.04'
        timeout-minutes: 5
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Build app and upload to draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        timeout-minutes: 50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: WorktreeView v__VERSION__
          releaseBody: Installers for Windows, macOS, and Linux. Builds are unsigned, so Windows SmartScreen and macOS Gatekeeper warn on first launch; see CONTRIBUTING.md in case you'd prefer to build from source.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}

  trigger-desktop-e2e:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch desktop e2e for the published release
        # A release created by GITHUB_TOKEN does not itself trigger other
        # workflows; workflow_dispatch is the documented exception.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run tauri-e2e.yml --ref main
