name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            bindir: aarch64-apple-darwin
            target: macos-arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            bindir: x86_64-apple-darwin
            target: macos-x64
          - platform: ubuntu-24.04
            args: ''
            bindir: ''
            target: linux-amd64
          - platform: windows-latest
            args: ''
            bindir: ''
            target: windows-x64
    runs-on: ${{ matrix.platform }}
    # covers the added server build on the slowest leg
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
          set-safe-directory: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set app version from tag
        timeout-minutes: 2
        shell: bash
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        timeout-minutes: 5
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        # The timeout also covers the post-build cache save, which is the
        # slow half on Windows' multi-gigabyte target directory.
        timeout-minutes: 15
        with:
          workspaces: src-tauri
          key: ${{ matrix.args }}

      - name: Install Linux packages
        if: matrix.platform == 'ubuntu-24.04'
        timeout-minutes: 5
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Build app and upload to draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        timeout-minutes: 50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: WorktreeView v__VERSION__
          releaseBody: Installers for Windows, macOS, and Linux, plus headless server tarballs (worktreeview-server-<version>-<target>.tar.gz with a .sha256 beside it; see docs/server.md). Builds are unsigned, so Windows SmartScreen and macOS Gatekeeper warn on first launch; see CONTRIBUTING.md in case you'd prefer to build from source.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}

      - name: Build server binary
        # a plain cargo build keeps the bundling run feature-free, so the
        # server bin rides the release without entering desktop bundles
        timeout-minutes: 20
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin worktreeview-server ${{ matrix.args }}

      - name: Upload server tarball
        shell: bash
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="worktreeview-server-${version}-${{ matrix.target }}"
          bin="worktreeview-server"
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            bin="worktreeview-server.exe"
          fi
          tdir="src-tauri/target/release"
          if [ -n "${{ matrix.bindir }}" ]; then
            tdir="src-tauri/target/${{ matrix.bindir }}/release"
          fi
          staging="$(mktemp -d)"
          cp "$tdir/$bin" "$staging/"
          tar -czf "$name.tar.gz" -C "$staging" "$bin"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          gh release upload "${GITHUB_REF_NAME}" "$name.tar.gz" "$name.tar.gz.sha256" --clobber

  bump-version:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: 24
          package-manager-cache: false

      - name: Stamp the released version
        timeout-minutes: 2
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Commit and push the version bump
        # The build never depends on this commit (each leg stamped its
        # workspace from the tag), so a rebase race with other work on main
        # only skips the bookkeeping commit; the release itself is done.
        continue-on-error: true
        timeout-minutes: 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Version files already at ${GITHUB_REF_NAME#v}; nothing to commit."
            exit 0
          fi
          git add -A
          git commit -m "bump version to ${GITHUB_REF_NAME#v}"
          git fetch origin main
          git rebase origin/main
          git push origin main

  trigger-desktop-e2e:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch desktop e2e for the published release
        # A release created by GITHUB_TOKEN does not itself trigger other
        # workflows; workflow_dispatch is the documented exception.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run tauri-e2e.yml --ref main
